<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile centered in 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#d62e0b"/>
  </g>
  <!-- document page -->
  <rect x="300" y="230" width="424" height="564" rx="40" fill="#ffffff"/>
  <!-- ArchieML lines -->
  <g font-family="Menlo, monospace" font-weight="700" fill="#000000">
    <text x="345" y="345" font-size="78">{a}</text>
  </g>
  <rect x="345" y="400" width="290" height="30" rx="15" fill="#d9d9d9"/>
  <rect x="345" y="460" width="220" height="30" rx="15" fill="#d9d9d9"/>
  <g font-family="Menlo, monospace" font-weight="700" fill="#d62e0b">
    <text x="345" y="590" font-size="78">[*]</text>
  </g>
  <rect x="345" y="640" width="260" height="30" rx="15" fill="#d9d9d9"/>
  <rect x="345" y="700" width="180" height="30" rx="15" fill="#d9d9d9"/>
</svg>
